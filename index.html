<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BFHL — Tree Hierarchy Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#12121a;--border:#1e1e2e;--accent:#7c3aed;--accent2:#06b6d4;--accent3:#f59e0b;--text:#e2e8f0;--muted:#64748b;--danger:#ef4444;--success:#10b981;--mono:'Space Mono',monospace;--display:'Syne',sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--display);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0}
header{position:relative;z-index:10;padding:2rem 3rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1.5rem}
.logo-glyph{width:44px;height:44px;background:var(--accent);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:1rem;font-weight:700;color:#fff;flex-shrink:0;animation:pulse-glow 3s ease-in-out infinite}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,0)}50%{box-shadow:0 0 20px 6px rgba(124,58,237,0.4)}}
header h1{font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;background:linear-gradient(90deg,#fff 0%,var(--accent2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{font-size:.78rem;color:var(--muted);font-family:var(--mono);margin-top:2px}
.container{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:2.5rem 2rem;display:grid;grid-template-columns:380px 1fr;gap:2rem;align-items:start}
.input-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.8rem;position:sticky;top:2rem}
.panel-label{font-size:.68rem;font-family:var(--mono);color:var(--accent2);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.8rem}
.api-url-field{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.6rem .9rem;color:var(--muted);font-family:var(--mono);font-size:.78rem;margin-bottom:1.4rem;outline:none;transition:border-color .2s}
.api-url-field:focus{border-color:var(--accent);color:var(--text)}
textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.9rem 1rem;color:var(--text);font-family:var(--mono);font-size:.82rem;resize:vertical;min-height:200px;outline:none;transition:border-color .2s;line-height:1.7}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:var(--muted)}
.hint{font-size:.72rem;color:var(--muted);font-family:var(--mono);margin-top:.6rem;line-height:1.6}
.btn-submit{width:100%;margin-top:1.2rem;padding:.9rem 1.5rem;background:var(--accent);border:none;border-radius:10px;color:#fff;font-family:var(--display);font-size:.95rem;font-weight:700;letter-spacing:.02em;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,.45)}
.btn-submit:active{transform:translateY(0)}
.btn-submit.loading{pointer-events:none;opacity:.75}
.btn-submit .btn-text{position:relative;z-index:1}
.btn-submit .spinner{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.btn-submit.loading .btn-text{visibility:hidden}
.btn-submit.loading .spinner{display:block}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.results-panel{min-height:400px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:400px;color:var(--muted);font-family:var(--mono);font-size:.85rem;gap:1rem;text-align:center}
.empty-icon{font-size:3rem;opacity:.3;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.error-banner{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);border-radius:10px;padding:1rem 1.2rem;color:var(--danger);font-family:var(--mono);font-size:.82rem;display:none;margin-bottom:1.5rem;animation:slide-in .3s ease}
.error-banner.visible{display:block}
@keyframes slide-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.identity-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.8rem;animation:slide-in .4s ease}
.id-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem}
.id-card .id-label{font-size:.65rem;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.3rem}
.id-card .id-value{font-size:.82rem;font-family:var(--mono);color:var(--accent2);word-break:break-all}
.summary-bar{display:flex;gap:1rem;margin-bottom:1.8rem;animation:slide-in .5s ease}
.summary-chip{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;text-align:center}
.summary-chip .chip-val{font-size:1.6rem;font-weight:800;color:var(--accent3);display:block;line-height:1}
.summary-chip .chip-lbl{font-size:.65rem;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:.3rem;display:block}
.summary-chip.highlight .chip-val{color:var(--accent2)}
.section-title{font-size:.68rem;font-family:var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.12em;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.hier-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.2rem;margin-bottom:2rem;animation:slide-in .5s ease}
.hier-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.2rem 1.4rem;transition:border-color .2s,transform .2s;position:relative;overflow:hidden}
.hier-card:hover{border-color:var(--accent);transform:translateY(-3px)}
.hier-card.cyclic{border-color:rgba(239,68,68,.3)}
.hier-card.cyclic:hover{border-color:var(--danger)}
.hier-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:14px 14px 0 0}
.hier-card.cyclic::before{background:var(--danger)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.root-badge{font-family:var(--mono);font-weight:700;font-size:1.4rem;color:var(--accent2)}
.depth-badge{font-family:var(--mono);font-size:.72rem;background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.3);color:var(--accent);padding:.2rem .6rem;border-radius:20px}
.cycle-badge{font-family:var(--mono);font-size:.72rem;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--danger);padding:.2rem .6rem;border-radius:20px}
.tree-view{font-family:var(--mono);font-size:.78rem;color:var(--text);line-height:1.8;max-height:200px;overflow-y:auto}
.tree-node{display:flex;align-items:center;gap:4px}
.tree-connector{color:var(--muted)}
.tree-label{color:var(--accent2);font-weight:700}
.tags-section{margin-bottom:2rem;animation:slide-in .6s ease}
.tags-row{display:flex;flex-wrap:wrap;gap:.5rem}
.tag{font-family:var(--mono);font-size:.75rem;padding:.25rem .7rem;border-radius:6px;border:1px solid}
.tag.invalid{color:var(--danger);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.08)}
.tag.duplicate{color:var(--accent3);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08)}
.tag.none{color:var(--muted);border-color:var(--border)}
.raw-toggle{background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:.72rem;padding:.4rem .8rem;border-radius:6px;cursor:pointer;transition:border-color .2s,color .2s;margin-bottom:.6rem}
.raw-toggle:hover{border-color:var(--accent);color:var(--accent)}
.raw-json{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:1rem 1.2rem;font-family:var(--mono);font-size:.74rem;line-height:1.7;color:var(--muted);overflow-x:auto;display:none;max-height:350px;overflow-y:auto;white-space:pre}
.raw-json.visible{display:block}
@media(max-width:800px){.container{grid-template-columns:1fr}.input-panel{position:static}header{padding:1.2rem 1.4rem}}
</style>
</head>
<body>

<header>
<div class="logo-glyph">BF</div>
<div>
<h1>BFHL — Tree Hierarchy Explorer</h1>
<p>POST /bfhl · Full Stack Engineering Challenge</p>
</div>
</header>

<div class="container">

<aside class="input-panel">
<div class="panel-label">API Endpoint</div>
<input class="api-url-field" id="apiUrl" type="text" value="http://localhost:4000" />

<div class="panel-label">Node List</div>
<textarea id="nodeInput">A->B
A->C
B->D</textarea>

<button class="btn-submit" id="submitBtn" onclick="submitData()">
<span class="btn-text">Analyse</span>
<span class="spinner"></span>
</button>
</aside>

<section class="results-panel">
<div id="errorBanner" class="error-banner"></div>
<pre id="output"></pre>
</section>

</div>

<script>
function parseInput(t){return t.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean)}

async function submitData(){
const api=document.getElementById('apiUrl').value.trim()
const data=parseInput(document.getElementById('nodeInput').value)
try{
const res=await fetch(api+'/bfhl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})})
const json=await res.json()
document.getElementById('output').textContent=JSON.stringify(json,null,2)
}catch(e){
document.getElementById('errorBanner').textContent=e.message
document.getElementById('errorBanner').classList.add('visible')
}
}
</script>

</body>
</html>
